name: Update HTB labs lists

on:
  push:
    branches: [main]
    paths:
      - 'writeups/hackthebox/Labs/*/README.md'
      - 'scripts/update_htb_labs.py'
      - '.github/workflows/update-htb-labs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh lab lists
        run: python scripts/update_htb_labs.py
      - name: Commit changed lists
        run: |
          if git diff --quiet -- README.md writeups/hackthebox/README.md writeups/hackthebox/Labs/README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md writeups/hackthebox/README.md writeups/hackthebox/Labs/README.md
          git commit -m "docs: refresh latest Hack The Box labs"
          git push
