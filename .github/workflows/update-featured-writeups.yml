name: Update featured write-ups

on:
  push:
    branches: [main]
    paths:
      - 'writeups/**/*.md'
      - 'scripts/update_featured_writeups.py'
      - '.github/workflows/update-featured-writeups.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh featured write-ups
        run: python scripts/update_featured_writeups.py
      - name: Commit changed indexes
        run: |
          if git diff --quiet -- README.md writeups/hackthebox/README.md writeups/hackthebox/Labs/README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md writeups/hackthebox/README.md writeups/hackthebox/Labs/README.md
          git commit -m "docs: refresh featured write-ups"
          git push
